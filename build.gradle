buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  sourceCompatibility = 17

  compileJava {
    options.incremental = true
    options.compilerArgs << "-Xlint:all"
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Tarmin2'
  repositories {
    mavenCentral()
//    maven { url 'https://s01.oss.sonatype.org' }
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
//    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
//    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url 'https://jitpack.io' }
  }
}

task generateSkybox(type: Exec) {
  group = 'assets'
  description = 'Generates 3D skybox landmarks using Blender 5.1'

  def blenderExec = 'blender'
  if (System.getProperty("os.name").toLowerCase().contains("win")) {
    def defaultWinPath = 'C:\\Program Files\\Blender Foundation\\Blender 5.1\\blender.exe'
    if (file(defaultWinPath).exists()) {
      blenderExec = defaultWinPath
    }
  }

  commandLine blenderExec, '-b', '-P', file('tools/blender/generate_skybox_landmarks.py').absolutePath
}

