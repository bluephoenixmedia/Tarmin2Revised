function tint(n){const c=H(n).primary,v=parseInt(c.slice(1),16),m=(x,y)=>Math.round(x+(y-x)*.45);return `rgb(${m(v>>16&255,255)},${m(v>>8&255,207)},${m(v&255,94)})`;}
function warHead(w,sz=34){return `<div class="wh">${arms(w.a,sz)}<div class="m ell hn" style="color:${tint(w.a)}">${hn(w.a)}</div><div class="s mut vs">against</div><div class="m ell hn r" style="color:${tint(w.b)}">${hn(w.b)}</div>${arms(w.b,sz)}</div>`;}
function warMeta(w){return `<div class="meta"><span class="s ant ell">${w.cause}, since the year ${w.since}</span><span class="s ant ell">Battles ${w.wa} to ${w.wb}: ${w.standing}</span></div>`;}
function miniWar(w){return `<div class="mini">${arms(w.a,20)}<span class="s ell grow" style="color:${tint(w.a)}">${sn(w.a)}</span><span class="s ant">${w.wa} to ${w.wb}</span><span class="s ell grow r" style="color:${tint(w.b)}">${sn(w.b)}</span>${arms(w.b,20)}</div>`;}
function standingList(){return `<div class="hd">YOUR STANDING</div>${ST.sworn?`<div class="s ant wrap pb">You are sworn to House Gullet.</div>`:''}`+standing().map(([n,v])=>{const st=ST.sworn&&n==='Gullet'?'Sworn':tier(v);return `<div class="st">${arms(n,20)}<span class="s ell grow" style="color:${tint(n)}">${sn(n)}</span><span class="s ant">${st} (${v})</span></div>`}).join('');}
function seatList(){return `<div class="hd">SEATS AT RISK</div>`+SEATS.map(s=>`<div class="s ant wrap pb">${hn(s.house)} holds ${s.gash} with its strength at ${s.strength}. One more lost battle may cost it the gash.</div>`).join('');}
function keys(extra=''){return `<div class="keys">${extra}<span class="k">W</span><span class="kl">Waypoint</span><span class="k">ESC</span><span class="kl">Return</span></div>`;}
function header(sub){return `<div class="head"><div class="ttl">THE WAR TABLE</div><div class="s mutg">${sub}</div></div>`;}
// ---------------- A: the ledger, today's screen extended ----------------
function vA(){const w=wars().map(w=>{const hs=hosts().filter(h=>h.war===w.id),sg=SIEGES.filter(x=>x.by===w.a);return `<div class="panel war">${warHead(w)}${warMeta(w)}<div>${sg.map(x=>siegeRow(x,28)).join('')}${hs.map(h=>hostRow(h,26)).join('')}</div></div>`}).join('');
 return header('Where the houses of the Maze are fighting, and who is winning')+`<div class="body two"><div class="scroll main">${hunterRow()}${contractRow()}${w}</div><div class="rail panel">${standingList()}${seatList()}</div></div>`+keys('<span class="k">UP DN</span><span class="kl">Scroll</span>');}
// ---------------- B: the table itself, a map with tokens ----------------
function detail(id){const h=hosts().find(h=>h.id===id);if(h)return `<div class="hd">${isOwn(h)?'YOUR HOUSE':'REPORTED'}</div>${hostRow(h,44)}`;const x=SIEGES.find(x=>x.id===id);return x?`<div class="hd">A SIEGE</div>${siegeRow(x,44)}`:'';}
function vB(){const it=ST.sel&&detail(ST.sel);return `<div class="headrow"><div class="ttl">THE WAR TABLE</div><div class="s mutg">What the Shelter has heard this sleep</div></div>
 <div class="body mapwrap"><div class="mapframe"><canvas id="tbl" width="1250" height="900"></canvas><div class="legend s"><span class="ant">Solid: certain</span><span class="mut">Ring: reported, rough</span><span class="mut">Dim: old news</span></div></div>
 <div class="rail panel side">${it||`<div class="s mut wrap pb">Choose a token.</div>`}${hunterRow()}${contractRow()}<div class="hd">THE WARS</div>${wars().map(miniWar).join('')}${seatList()}${standingList()}</div></div>`+keys('<span class="k">TAB</span><span class="kl">Next token</span>');}
function drawTable(){const c=document.getElementById('tbl');if(!c)return;const g=c.getContext('2d'),W=c.width,Hh=c.height,cx=W/2,cy=Hh/2,U=36;let r=12345;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;g.fillStyle='#120d07';g.fillRect(0,0,W,Hh);for(let i=0;i<260;i++){g.fillStyle=`rgba(${60+rnd()*40},${40+rnd()*20},20,${.02+rnd()*.04})`;g.beginPath();g.arc(rnd()*W,rnd()*Hh,18+rnd()*80,0,7);g.fill();}
 const gates=[['Mist Gate',12,-3],['Crimson Gate',10,9],['Verdant Gate',3,9],['Dune Gate',-13,4],['Frost Gate',-6,-10]];g.font='18px TV';g.textAlign='center';g.textBaseline='middle';
 for(const[n,x,y]of gates){g.strokeStyle='#5A3D18';g.lineWidth=4;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+x*U,cy+y*U);g.stroke();g.fillStyle='#9A7233';g.fillText(n,cx+x*U,cy+y*U+16);}
 g.fillStyle='#FFCF5E';g.fillRect(cx-10,cy-10,20,20);g.fillStyle='#120d07';g.fillRect(cx-5,cy-5,10,10);g.fillStyle='#F0C96A';g.fillText('The Shelter',cx,cy+26);
 for(const x of SIEGES){const px=cx+x.x*U,py=cy+x.y*U;g.lineWidth=ST.sel===x.id?5:3;g.strokeStyle='#C24A34';g.beginPath();g.arc(px,py,34,0,7);g.stroke();g.drawImage(toC(x.by,40),px-21,py-23);g.fillStyle='#FFCF5E';g.fillText('Siege of '+x.seat,px,py+50);x._p=[px,py,40];}
 for(const h of hosts()){const px=cx+h.x*U,py=cy+h.y*U,old=!h.age.startsWith('This'),own=isOwn(h);g.save();g.globalAlpha=old&&!own?.5:1;if(!own){g.setLineDash([6,5]);g.lineWidth=ST.sel===h.id?3:2;g.strokeStyle='#9A7233';g.beginPath();g.arc(px,py,30,0,7);g.stroke();g.setLineDash([]);}
  if(h.heading!=='halted'){const a={north:-Math.PI/2,south:Math.PI/2,east:0,west:Math.PI}[h.heading],R=own?24:36;g.fillStyle=own?'#FFCF5E':'#F0C96A';g.save();g.translate(px+Math.cos(a)*R,py+Math.sin(a)*R);g.rotate(a);g.beginPath();g.moveTo(9,0);g.lineTo(-6,-7);g.lineTo(-6,7);g.closePath();g.fill();g.restore();}
  g.drawImage(toC(h.house,30),px-16,py-18);if(ST.sel===h.id){g.strokeStyle='#FFCF5E';g.lineWidth=2;g.strokeRect(px-22,py-24,44,50);}g.restore();h._p=[px,py,30];}
 c.onclick=e=>{const b=c.getBoundingClientRect(),k=c.width/b.width,mx=(e.clientX-b.left)*k,my=(e.clientY-b.top)*k;for(const t of hosts().concat(SIEGES)){const[px,py,r]=t._p||[0,0,0];if(Math.hypot(mx-px,my-py)<r+6){ST.sel=t.id;render();return;}}};}
// ---------------- C: face to face, one war at a time ----------------
function vC(){const ws=wars(),tab=Math.min(ST.tab,ws.length);const tabs=ws.map((w,i)=>`<div class="tab click${tab===i?' on':''}" data-tab="${i}">${arms(w.a,22)}<span class="s">${w.wa} to ${w.wb}</span>${arms(w.b,22)}</div>`).join('')+`<div class="tab click${tab===ws.length?' on':''}" data-tab="${ws.length}"><span class="s">YOU</span></div>`;
 let page;if(tab===ws.length)page=`<div class="youpage"><div class="panel">${hunterRow()}${contractRow()}${seatList()}</div><div class="panel">${standingList()}</div></div>`;else{const w=ws[tab];const side=n=>{const hs=hosts().filter(h=>h.war===w.id&&h.house===n),sg=SIEGES.filter(x=>x.by===n);return `<div class="side2 panel"><div class="big">${arms(n,84)}<div class="grow"><div class="ttl2 ell" style="color:${tint(n)}">${hn(n)}</div><div class="s mut ell">${H(n).doctrine}. ${H(n).words}.</div></div></div>${sg.map(x=>siegeRow(x,28)).join('')}${hs.map(h=>hostRow(h,26)).join('')||'<div class="s mut">No word of its hosts.</div>'}</div>`};
  page=`<div class="mid"><div class="m ant">${w.cause}, since the year ${w.since}</div><div class="ttl2 gold">Battles ${w.wa} to ${w.wb}</div><div class="s ant">${w.standing}. The front: ${w.front}.</div></div><div class="faces">${side(w.a)}${side(w.b)}</div>`;}
 return `<div class="headrow"><div class="ttl">THE WAR TABLE</div><div class="tabs">${tabs}</div></div><div class="body one">${page}</div>`+keys('<span class="k">L R</span><span class="kl">War</span>');}
// ---------------- D: dispatches, urgency and nearness first ----------------
function vD(){const near=hosts().filter(h=>h.days<=3),far=hosts().filter(h=>h.days>3),aimed=hunterRow()+contractRow();
 return header('What the Shelter has heard this sleep')+`<div class="body two"><div class="scroll main">${aimed?`<div class="hd">AIMED AT YOU</div>${aimed}`:''}<div class="hd">SIEGES</div>${SIEGES.map(x=>siegeRow(x)).join('')}<div class="hd">NEAR THE SHELTER</div>${near.map(h=>hostRow(h)).join('')||'<div class="s mut wrap pb">No word of a host within three days.</div>'}<div class="hd">FARTHER OFF</div>${far.map(h=>hostRow(h)).join('')}</div>
 <div class="rail panel"><div class="hd">THE WARS</div>${wars().map(miniWar).join('')}${seatList()}${standingList()}</div></div>`+keys('<span class="k">UP DN</span><span class="kl">Scroll</span>');}
// ---------------- the page (throwaway) ----------------
const VARIANTS={A:['A: Ledger',"Today's scrolling list; each war carries its sieges and hosts. Standing in a rail.",vA],B:['B: The table','A map with tokens on it; the details sit beside the map.',vB],C:['C: Face to face','One war per tab, the two houses side by side, their hosts under them.',vC],D:['D: Dispatches','News, not wars: what aims at you, then sieges, then the nearest hosts first.',vD]};
function firstVisit(){return ST.first?`<div class="veil"><div class="fv panel"><div class="ttl2 gold">THE WAR TABLE</div><div class="m txt wrap">The houses are at war, and their armies march whether you watch or not.</div><div class="m txt wrap">These marks show where they were reported. Only a siege is certain.</div><div class="m txt wrap">When you reach a fight, you choose a side.</div><div class="s mut">Press any key</div></div></div>`:'';}
function render(){document.getElementById('stage').innerHTML=VARIANTS[ST.v][2]()+firstVisit();drawTable();
 document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{ST.sel=e.dataset.id;render();});document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{ST.tab=+e.dataset.tab;render();});
 document.getElementById('label').textContent=VARIANTS[ST.v][0]+' - '+VARIANTS[ST.v][1];
 for(const k of['sworn','first','stress'])document.getElementById(k).className=ST[k]?'on':'';
 const q=new URLSearchParams({variant:ST.v});for(const k of['sworn','first','stress'])if(ST[k])q.set(k,'1');history.replaceState(null,'','?'+q);fit();}
function fit(){const s=Math.min(innerWidth/1920,(innerHeight-44)/1080);document.getElementById('stage').style.transform=`scale(${s})`;}
function go(d){const K=Object.keys(VARIANTS);ST.v=K[(K.indexOf(ST.v)+d+K.length)%K.length];ST.sel=null;render();}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
for(const k of['sworn','first','stress'])document.getElementById(k).onclick=()=>{ST[k]=!ST[k];render();};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});addEventListener('resize',fit);
render();document.fonts.load('20px TV').then(render);
</script></body></html>
