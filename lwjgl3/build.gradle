
buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath "io.github.fourlastor:construo:1.7.1"
    if(enableGraalNative == 'true') {
      classpath "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin:0.9.28"
    }
  }
}
plugins {
  id "application"
}
apply plugin: 'io.github.fourlastor.construo'


import io.github.fourlastor.construo.Target

def unusedAssetPatterns = [
  'images/monsters/Kenney Game Assets 1 version 42/**',
  'images/monsters/Super Pixel Effects Gigapack (Free Version) v2.0.0/**',
  'images/monsters/x768p_HQ_Uncompressed_Frames/**',
  'images/monsters/MP1/**',
  'images/monsters/DELUXE_PNG/**',
  'images/monsters/RPG_Items_Retro_Itchio/**',
  'images/monsters/explosion pack 1/**',
  'images/monsters/Free Characters with Animations For FPS game/**',
  'images/monsters/free_cthulu_v1/**',
  'images/monsters/Sci-Fi SFX Pack/**',
  'images/monsters/DungeonProps-1.4.5/**',
  'images/monsters/TT_Battlers_3_Wild_Beasts/**',
  'images/monsters/mino_v1.1_free/**',
  'images/monsters/BearFX Explosions/**',
  'images/monsters/EVil Wizard 2/**',
  'images/monsters/Golems_Free_Version/**',
  'images/monsters/Hobgoblin/**',
  'images/monsters/Mecha-stone Golem 0.1/**',
  'images/monsters/Rat/**',
  'images/monsters/Undead executioner/**',
  'images/monsters/waechter-19/**',
  'images/monsters/waechter-20/**',
  'images/monsters/Free Pixel Effects Pack/**',
  'images/monsters/old/**',
  'images/monsters/*.blend',
  'logs/**',
  'saves/**',
  '*.txt',
  'assets.txt'
]

sourceSets.main.resources {
  srcDirs += [ rootProject.file('assets').path ]
  unusedAssetPatterns.each { pattern ->
    exclude pattern
  }
}

tasks.register('generateAssetList') {
  File assetsFolder = new File("${project.rootDir}/assets/")
  File assetsFile = new File(assetsFolder, "assets.txt")

  inputs.files(fileTree(assetsFolder) {
    unusedAssetPatterns.each { pattern -> exclude pattern }
  })
  outputs.file(assetsFile)

  doLast {
    def lines = fileTree(assetsFolder) {
      unusedAssetPatterns.each { pattern -> exclude pattern }
    }
      .collect { assetsFolder.relativePath(it) }
      .sort()
    byte[] content = (lines.join("\n") + "\n").getBytes("UTF-8")

    // Single NIO write avoids Windows file-lock races from antivirus/watchers
    Exception lastEx = null
    for (int i = 0; i < 5; i++) {
      try {
        java.nio.file.Files.write(assetsFile.toPath(), content)
        lastEx = null
        break
      } catch (IOException e) {
        lastEx = e
        Thread.sleep(300)
      }
    }
    if (lastEx != null) throw lastEx
  }
}

processResources.dependsOn 'generateAssetList'

mainClassName = 'com.bpm.minotaur.lwjgl3.Lwjgl3Launcher'
application.setMainClass(mainClassName)
java.sourceCompatibility = 17
java.targetCompatibility = 17
if (JavaVersion.current().isJava9Compatible()) {
        compileJava.options.release.set(17)
}

dependencies {
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
  implementation "org.bytedeco:ffmpeg-platform:6.1.1-1.5.10" // FFmpeg binaries
  implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion" // <--- ADD THIS LINE
  implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion" // For TexturePacker
  implementation project(':core')

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-backend-lwjgl3:$graalHelperVersion"

    }
}

def os = System.properties['os.name'].toLowerCase()

run {
  workingDir = project.rootDir
// You can uncomment the next line if your IDE claims a build failure even when the app closed properly.
  //setIgnoreExitValue(true)

  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
}

jar {
// sets the name of the .jar file this produces to the name of the game or app, with the version after.
  archiveFileName.set("${appName}-${projectVersion}.jar")
// the duplicatesStrategy matters starting in Gradle 7.0; this setting works.
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
// these "exclude" lines remove some unnecessary duplicate files in the output JAR.
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
// setting the manifest makes the JAR runnable.
// enabling native access helps avoid a warning when Java 24 or later runs the JAR.
  manifest {
    attributes 'Main-Class': project.mainClassName, 'Enable-Native-Access': 'ALL-UNNAMED'
  }
// this last step may help on some OSes that need extra instruction to make runnable JARs.
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

// Builds a JAR that only includes the files needed to run on macOS, not Windows or Linux.
// The file size for a Mac-only JAR is about 7MB smaller than a cross-platform JAR.
tasks.register("jarMac") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-mac.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dll", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Linux, not Windows or macOS.
// The file size for a Linux-only JAR is about 5MB smaller than a cross-platform JAR.
tasks.register("jarLinux") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-linux.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**", "**/*.dll", "**/*.dylib",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Windows, not Linux or macOS.
// The file size for a Windows-only JAR is about 6MB smaller than a cross-platform JAR.
tasks.register("jarWin") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-win.jar")
  jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dylib", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

construo {
    // name of the executable
    name.set(appName)
    // human-readable name, used for example in the `.app` name for macOS
    humanName.set(appName)
    // Optional, defaults to project version property
    version.set("$projectVersion")

    targets.configure {
      register("linuxX64", Target.Linux) {
        architecture.set(Target.Architecture.X86_64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_linux_hotspot_17.0.15_6.tar.gz")
        // Linux does not currently have a way to set the icon on the executable
      }
      register("macM1", Target.MacOs) {
        architecture.set(Target.Architecture.AARCH64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.15_6.tar.gz")
        // macOS needs an identifier
        identifier.set("com.bpm.minotaur." + appName)
        // Optional: icon for macOS, as an ICNS file
        macIcon.set(project.file("icons/logo.icns"))
      }
      register("macX64", Target.MacOs) {
        architecture.set(Target.Architecture.X86_64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_mac_hotspot_17.0.15_6.tar.gz")
        // macOS needs an identifier
        identifier.set("com.bpm.minotaur." + appName)
        // Optional: icon for macOS, as an ICNS file
        macIcon.set(project.file("icons/logo.icns"))
      }
      register("winX64", Target.Windows) {
        architecture.set(Target.Architecture.X86_64)
        // Optional: icon for Windows, as a PNG
        icon.set(project.file("icons/logo.png"))
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_windows_hotspot_17.0.15_6.zip")
        // Uncomment the next line to show a console when the game runs, to print messages.
        //useConsole.set(true)
      }
    }
}

// Equivalent to the jar task; here for compatibility with gdx-setup.
tasks.register('dist') {
  dependsOn 'jar'
}

distributions {
  main {
    contents {
      into('libs') {
        project.configurations.runtimeClasspath.files.findAll { file ->
          file.getName() != project.tasks.jar.outputs.files.singleFile.name
        }.each { file ->
          exclude file.name
        }
      }
    }
  }
}

startScripts.dependsOn(':lwjgl3:jar')
startScripts.classpath = project.tasks.jar.outputs.files

if(enableGraalNative == 'true') {
  apply from: file("nativeimage.gradle")
}

task runSpawnTest(type: JavaExec) {
    group = "verification"
    description = "Runs the Spawn Distribution Test"
    mainClass = 'com.bpm.minotaur.lwjgl3.SpawnDistributionTest'
    classpath = sourceSets.main.runtimeClasspath
    standardOutput = System.out
    workingDir = rootProject.file('assets')
    ignoreExitValue = true
}

task runSpritePreviewer(type: JavaExec) {
    group = "debug"
    description = "Runs the Sprite Previewer Tool"
    mainClass = 'com.bpm.minotaur.lwjgl3.SpritePreviewerLauncher'
    classpath = sourceSets.main.runtimeClasspath
    standardOutput = System.out
    workingDir = rootProject.file('assets')
    ignoreExitValue = true
}

task runHeadlessSimulation(type: JavaExec) {
    group = "verification"
    description = "Runs the Headless Game Simulation"
    mainClass = 'com.bpm.minotaur.lwjgl3.HeadlessSimulationLauncher'
    classpath = sourceSets.main.runtimeClasspath
    standardOutput = System.out
    workingDir = rootProject.file('assets')
    ignoreExitValue = true
}

task runTexturePacker(type: JavaExec) {
    group = "tools"
    description = "Runs the Texture Packer"
    mainClass = 'com.bpm.minotaur.lwjgl3.PackTextures'
    classpath = sourceSets.main.runtimeClasspath
    standardOutput = System.out
    workingDir = project.rootDir
    ignoreExitValue = true
}

task runUnlockSimulation(type: JavaExec) {
    group = "verification"
    description = "Runs the Unlock System Simulation"
    mainClass = 'com.bpm.minotaur.lwjgl3.UnlockSimulationLauncher'
    classpath = sourceSets.main.runtimeClasspath
    standardOutput = System.out
    workingDir = rootProject.file('assets')
    ignoreExitValue = true
}
